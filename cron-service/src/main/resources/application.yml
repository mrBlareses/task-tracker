server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: cron-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: db/changelog/changelog-master.xml
    enabled: true

auth:
  base-url: ${AUTH_BASE_URL}
  login-endpoint: ${AUTH_LOGIN_ENDPOINT}
  email: ${AUTH_EMAIL}
  password: ${AUTH_PASSWORD}

cron:
  daily-analytics:
    expression: ${CRON_DAILY_ANALYTICS_EXPRESSION}
    zone: ${CRON_DAILY_ANALYTICS_ZONE:UTC}
    backend-base-url: ${CRON_DAILY_ANALYTICS_BACKEND_BASE_URL}
    trigger-path: ${CRON_DAILY_ANALYTICS_TRIGGER_PATH}
    stale-threshold: ${CRON_DAILY_ANALYTICS_STALE_THRESHOLD:PT15M}

retry:
  daily-analytics:
    max-attempts: ${RETRY_DAILY_ANALYTICS_MAX_ATTEMPTS:3}
    first-backoff: ${RETRY_DAILY_ANALYTICS_FIRST_BACKOFF:1s}
    second-backoff: ${RETRY_DAILY_ANALYTICS_SECOND_BACKOFF:2s}
    third-backoff: ${RETRY_DAILY_ANALYTICS_THIRD_BACKOFF:5s}