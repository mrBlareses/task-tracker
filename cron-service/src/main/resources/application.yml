server:
  port: 8082

spring:
  application:
    name: cron-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/task_tracker_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
    enabled: true

cron:
  daily-analytics:
    expression: ${CRON_DAILY_ANALYTICS_EXPRESSION:0 */1 * * * *}
    zone: ${CRON_DAILY_ANALYTICS_ZONE:UTC}
    backend-base-url: ${CRON_DAILY_ANALYTICS_BACKEND_BASE_URL:http://backend-service:8081}
    trigger-path: ${CRON_DAILY_ANALYTICS_TRIGGER_PATH:/api/v1/service/daily-analytics/run}

auth:
  url: http://backend-service:8081
  login-endpoint: /api/v1/auth/login

retry:
  max-attempts: 3
  delay: 2s