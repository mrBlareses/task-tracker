plugins {
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'java'
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
    id "org.openapi.generator" version "7.13.0"
}

group = 'org.mushroom'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.toVersion(21)
    targetCompatibility = JavaVersion.toVersion(21)
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://packages.confluent.io/maven/' }
}

ext["testcontainers.version"] = "1.21.0"

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // PostgreSQL драйвер
    runtimeOnly 'org.postgresql:postgresql'

    // Liquibase
    implementation 'org.liquibase:liquibase-core'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'

    // Kafka + Avro
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.avro:avro:1.11.3'
    implementation 'io.confluent:kafka-avro-serializer:7.6.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.2'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // ===== .env =====
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // TEST
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testcontainers
    testImplementation enforcedPlatform("org.testcontainers:testcontainers-bom:1.21.3")
    testImplementation "org.testcontainers:junit-jupiter"
    testImplementation "org.testcontainers:postgresql"
}

avro {
    stringType = "String"
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateAvroJava')
}

// ============ OPENAPI GENERATION ============
tasks.register('createOpenApiDir') {
    doLast {
        file("${projectDir}/openapi").mkdirs()
    }
}

tasks.register('generateUserApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    group = 'OpenAPI'
    description = 'Generate User API from OpenAPI spec'

    dependsOn createOpenApiDir

    generatorName = 'spring'
    inputSpec = "${projectDir}/openapi/user-api.yml"
    outputDir = "${buildDir}/generated/user-api"

    configOptions = [
            useSpringBoot3    : "true",
            useTags           : "true",
            useBeanValidation : "true",
            openApiNullable   : "false",
            interfaceOnly     : "true",
            apiPackage        : "org.mushroom.api",
            modelPackage      : "org.mushroom.model",
            configPackage     : "org.mushroom.config",
            useLombok         : "true",
            lombokBuilder     : "true",
            modelLombok       : "true",
            modelLombokBuilder: "true"
    ]

    doFirst {
        logger.lifecycle("Generating User API from: ${inputSpec}")
    }

    doLast {
        logger.lifecycle("User API generated to: ${outputDir}")
    }
}

tasks.register('generateTaskApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    group = 'OpenAPI'
    description = 'Generate Task API from OpenAPI spec'

    dependsOn createOpenApiDir

    generatorName = 'spring'
    inputSpec = "${projectDir}/openapi/task-api.yml"
    outputDir = "${buildDir}/generated/task-api"

    configOptions = [
            useSpringBoot3    : "true",
            useTags           : "true",
            useBeanValidation : "true",
            openApiNullable   : "false",
            interfaceOnly     : "true",
            apiPackage        : "org.mushroom.api.task",
            modelPackage      : "org.mushroom.model.task",
            configPackage     : "org.mushroom.openapi.config.task",
            useLombok         : "true",
            lombokBuilder     : "true",
            modelLombok       : "true",
            modelLombokBuilder: "true"
    ]

    doFirst {
        logger.lifecycle("Generating Task API from: ${inputSpec}")
    }

    doLast {
        logger.lifecycle("Task API generated to: ${outputDir}")
    }
}

tasks.register('generateServiceApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    group = 'OpenAPI'
    description = 'Generate Service API from OpenAPI spec'

    dependsOn createOpenApiDir

    generatorName = 'spring'
    inputSpec = "${projectDir}/openapi/service-api.yml"
    outputDir = "${buildDir}/generated/service-api"

    apiPackage = "org.mushroom.service.api"
    modelPackage = "org.mushroom.service.model"

    configOptions = [
            useSpringBoot3    : "true",
            useTags           : "true",
            useBeanValidation : "true",
            openApiNullable   : "false",
            interfaceOnly     : "true",
            useLombok         : "true",
            lombokBuilder     : "true",
            modelLombok       : "true",
            modelLombokBuilder: "true"
    ]
}

// ============ MAPSTRUCT CONFIGURATION ============
tasks.withType(JavaCompile).configureEach {
    options.annotationProcessorPath = configurations.annotationProcessor
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateUserApi')
    dependsOn tasks.named('generateTaskApi')
    dependsOn tasks.named('generateServiceApi')

    options.annotationProcessorPath = configurations.annotationProcessor
}

sourceSets {
    main {
        java {
            srcDirs = [
                    'src/main/java',
                    "${buildDir}/generated/user-api/src/main/java",
                    "${buildDir}/generated/task-api/src/main/java",
                    "${buildDir}/generated/service-api/src/main/java",
                    "${buildDir}/generated/sources/annotationProcessor/java/main"
            ]
        }
    }
}

tasks.register('checkOpenApiSpec') {
    group = 'OpenAPI'
    description = 'Check if OpenAPI spec exists'

    doFirst {
        def specFile = file("${projectDir}/openapi/user-api.yml")
        if (!specFile.exists()) {
            throw new GradleException("OpenAPI spec not found: ${specFile.absolutePath}")
        }
        logger.lifecycle("OpenAPI spec found: ${specFile.absolutePath}")
    }
}

tasks.named('generateUserApi') {
    dependsOn tasks.named('checkOpenApiSpec')
}

tasks.register('cleanOpenApi', Delete) {
    group = 'OpenAPI'
    description = 'Clean generated OpenAPI code'
    delete "${buildDir}/generated"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            '-Amapstruct.defaultComponentModel=spring',
            '-Amapstruct.unmappedTargetPolicy=IGNORE',
            '-Amapstruct.suppressGeneratorTimestamp=true'
    ]
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

clean {
    dependsOn tasks.named('cleanOpenApi')
}

test {
    useJUnitPlatform()
}