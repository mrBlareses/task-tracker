server:
  port: 8081
  servlet:
    session:
      timeout: 15m

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/task-tracker
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    change-log: classpath:db.migration/changelog.xml
    enabled: true
