openapi: 3.0.0
info:
  title: Task Tracker Service API
  description: API for scheduler/cron services
  version: 1.0.0

servers:
  - url: http://localhost:8081

paths:
  /api/v1/service/daily-analytics:
    get:
      summary: Build daily task analytics for all users (service-only)
      operationId: getDailyAnalytics
      tags:
        - ServiceAnalytics
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Daily analytics successfully built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAnalyticsResponse'
        '401':
          description: Unauthorized (missing/invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (requires SERVICE role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DailyAnalyticsResponse:
      type: object
      required:
        - summaries
      properties:
        from:
          type: string
          format: date-time
          description: Start of analytics window (inclusive).
        to:
          type: string
          format: date-time
          description: End of analytics window (exclusive).
        summaries:
          type: array
          items:
            $ref: '#/components/schemas/DailyReport'

    DailyReport:
      type: object
      required:
        - userId
        - email
        - pendingCount
        - completedCount
      properties:
        userId:
          type: string
          format: uuid
          description: User identifier.
        email:
          type: string
          format: email
          description: User email.
        pendingCount:
          type: integer
          format: int64
          description: Count of tasks with status TODO or IN_PROGRESS.
        completedCount:
          type: integer
          format: int64
          description: Count of tasks marked DONE during [from, to).

    ErrorResponse:
      type: object
      required:
        - message
        - timestamp
        - path
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
