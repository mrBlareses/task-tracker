openapi: 3.0.0
info:
  title: Task Tracker Service API
  description: API for scheduler/cron services
  version: 1.0.0

servers:
  - url: http://localhost:8081

paths:
  /api/v1/service/daily-analytics/run:
    post:
      summary: Trigger daily analytics build for all users
      operationId: collectDailyAnalytics
      tags:
        - ServiceAnalytics
      responses:
        '202':
          description: Daily analytics accepted for processing
        '401':
          description: Unauthorized (missing/invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (requires SERVICE role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
        - timestamp
        - path
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT