services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-task_tracker_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - task-tracker-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - task-tracker-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9093}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:${KAFKA_EXTERNAL_PORT:-9093}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    ports:
      - "9092:9092"
      - "${KAFKA_EXTERNAL_PORT:-9093}:${KAFKA_EXTERNAL_PORT:-9093}"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '>/dev/tcp/localhost/9092'" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - task-tracker-net

  backend-service:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    depends_on:
        postgres:
          condition: service_healthy
        kafka:
          condition: service_healthy
    ports:
      - "8081:8081"
    env_file:
    - ./.env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SERVER_PORT: ${SERVER_PORT}
    restart: unless-stopped
    networks:
      - task-tracker-net
  cron-service:
    build:
      context: .
      dockerfile: cron-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      backend-service:
        condition: service_started
    ports:
      - "8082:8082"
    env_file:
      - ./.env
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_tracker_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      AUTH_BASE_URL: http://backend-service:8081
      AUTH_LOGIN_ENDPOINT: /api/v1/auth/login
      AUTH_EMAIL: service@local
      AUTH_PASSWORD: service123

      CRON_DAILY_ANALYTICS_EXPRESSION: "0 */1 * * * *"
      CRON_DAILY_ANALYTICS_ZONE: UTC
      CRON_DAILY_ANALYTICS_BACKEND_BASE_URL: http://backend-service:8081
      CRON_DAILY_ANALYTICS_TRIGGER_PATH: /api/v1/service/daily-analytics/run
      CRON_DAILY_ANALYTICS_STALE_THRESHOLD: PT15M

      RETRY_DAILY_ANALYTICS_MAX_ATTEMPTS: 3
      RETRY_DAILY_ANALYTICS_FIRST_BACKOFF: 1s
      RETRY_DAILY_ANALYTICS_SECOND_BACKOFF: 2s
      RETRY_DAILY_ANALYTICS_THIRD_BACKOFF: 5s
    restart: unless-stopped
    networks:
      - task-tracker-net

volumes:
  postgres_data:
  kafka_data:

networks:
  task-tracker-net:
    driver: bridge