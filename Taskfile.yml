version: "3"

dir: "{{.ROOT_DIR}}"

vars:
  GRADLE_CMD: '{{if eq OS "windows"}}cmd /c gradlew.bat{{else}}./gradlew{{end}}'
  COMPOSE: "docker compose --env-file .env"

tasks:
  build:
    desc: Полная Gradle сборка проекта
    cmds:
      - "{{.GRADLE_CMD}} clean build"

  test:
    desc: Запуск всех тестов проекта
    cmds:
      - "{{.GRADLE_CMD}} test"

  infra:
    desc: Поднять только инфраструктуру
    cmds:
      - "{{.COMPOSE}} up -d postgres zookeeper kafka schema-registry mailhog"

  services:
    desc: Поднять только application сервисы
    cmds:
      - "{{.COMPOSE}} up -d --build backend-service cron-service email-sender-service"

  up:
    desc: Поднять всё окружение целиком
    cmds:
      - "{{.COMPOSE}} up -d --build"

  stop:
    desc: Остановить контейнеры
    cmds:
      - "{{.COMPOSE}} stop"

  clean:
    desc: Остановить контейнеры и удалить volumes
    cmds:
      - "{{.COMPOSE}} down -v --remove-orphans"

  logs:
    desc: Просмотр логов всех контейнеров
    cmds:
      - "{{.COMPOSE}} logs -f"

  ps:
    desc: Показать статус контейнеров проекта
    cmds:
      - "{{.COMPOSE}} ps"