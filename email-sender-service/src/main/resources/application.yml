server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: email-sender-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: db/changelog/changelog-master.xml
    enabled: true

  mail:
    host: ${SPRING_MAIL_HOST:mailhog}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
      mail.smtp.connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${SPRING_MAIL_SMTP_TIMEOUT:5000}
      mail.smtp.writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:email-sender-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        schema.registry.url: ${SPRING_KAFKA_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: true

email-ingestion:
  topics:
    user-registered: ${EMAIL_INGESTION_TOPIC_USER_REGISTERED:user-registered}
    daily-report: ${EMAIL_INGESTION_TOPIC_DAILY_REPORT:daily-report}
  concurrency: ${EMAIL_INGESTION_CONCURRENCY:1}
  retry-interval-ms: ${EMAIL_INGESTION_RETRY_INTERVAL_MS:2000}
  retry-max-attempts: ${EMAIL_INGESTION_RETRY_MAX_ATTEMPTS:3}

email-processing:
  fixed-delay-ms: ${EMAIL_PROCESSING_FIXED_DELAY_MS:5000}
  batch-size: ${EMAIL_PROCESSING_BATCH_SIZE:50}
  max-attempts: ${EMAIL_PROCESSING_MAX_ATTEMPTS:5}
  retry-delay-minutes: ${EMAIL_PROCESSING_RETRY_DELAY_MINUTES:5}

app:
  mail:
    from: ${APP_MAIL_FROM:no-reply@task-tracker.local}